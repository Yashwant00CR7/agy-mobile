<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Antigravity Mobile</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <button id="btn-menu" class="icon-btn" aria-label="Menu">☰</button>
      <div class="workspace-badge" id="btn-workspace-header">
        <span id="header-ws-name" class="workspace-title">Workspace</span>
        <span id="header-git-branch" class="branch-badge">git: main</span>
      </div>
    </div>

    <div class="header-right">
      <div id="mode-toggle-btn" class="mode-toggle" title="Toggle Autonomous / Supervised mode">
        <span class="status-dot"></span>
        <span id="mode-label">Autonomous</span>
      </div>

      <div class="view-tabs">
        <button id="tab-chat" class="tab-btn active">Chat</button>
        <button id="tab-term" class="tab-btn">Term</button>
      </div>
    </div>
  </header>

  <!-- Navigation Drawer (Workspaces & History) -->
  <div id="drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="drawer" class="drawer left">
    <div class="drawer-header">
      <span class="drawer-title">Navigation</span>
      <button id="btn-close-drawer" class="icon-btn">✕</button>
    </div>
    <div class="drawer-content">
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <button id="subtab-ws" class="tab-btn active" style="flex:1;">Workspaces</button>
        <button id="subtab-convs" class="tab-btn" style="flex:1;">History</button>
      </div>

      <!-- Workspaces Subview -->
      <div id="drawer-ws-view">
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px;">CURRENT PATH</div>
        <div id="drawer-current-path" style="font-family: monospace; font-size: 0.8rem; word-break: break-all; margin-bottom: 12px; color: var(--accent-primary);"></div>
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px;">SUBDIRECTORIES</div>
        <div id="drawer-ws-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
      </div>

      <!-- History Subview -->
      <div id="drawer-convs-view" style="display: none;">
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px;">RECENT CONVERSATIONS</div>
        <div id="drawer-convs-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
      </div>
    </div>
  </aside>

  <!-- Main Viewports -->
  <main class="main-viewport">
    <!-- Chat View -->
    <section id="chat-pane" class="view-pane">
      <div id="chat-messages" class="chat-scroll-area">
        <div class="message-card assistant">
          <strong>Antigravity Mobile Ready</strong><br>
          Connected to Termux daemon. Enter a prompt below or use voice dictation.
        </div>
      </div>

      <!-- Chat Input Area -->
      <footer class="chat-input-bar">
        <div class="chips-row">
          <button class="chip" data-prompt="git status">git status</button>
          <button class="chip" data-prompt="review current diffs">/diff</button>
          <button class="chip" data-prompt="run project tests">npm test</button>
          <button class="chip" data-prompt="Explain current project architecture">Explain</button>
          <button class="chip" data-prompt="Diagnose and fix any current errors">Fix error</button>
        </div>

        <div class="input-row">
          <button id="btn-mic" class="btn-mic" title="Voice Input" aria-label="Microphone">🎤</button>
          <textarea id="prompt-input" rows="1" placeholder="Ask agy anything..."></textarea>
          <button id="btn-send" class="btn-send" aria-label="Send">➤</button>
        </div>
      </footer>
    </section>

    <!-- Terminal View -->
    <section id="term-pane" class="view-pane hidden">
      <div id="term-output" class="terminal-view">
        <div id="term-text" class="terminal-output"></div>
      </div>

      <div class="terminal-accessory-bar">
        <button class="acc-key" data-key="\x1b">ESC</button>
        <button class="acc-key" data-key="\t">TAB</button>
        <button class="acc-key" data-key="CTRL">CTRL</button>
        <button class="acc-key" data-key="ALT">ALT</button>
        <button class="acc-key" data-key="\x1b[A">▲</button>
        <button class="acc-key" data-key="\x1b[B">▼</button>
        <button class="acc-key" data-key="\x1b[D">◀</button>
        <button class="acc-key" data-key="\x1b[C">▶</button>
        <button class="acc-key" data-key="\x03">^C</button>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
